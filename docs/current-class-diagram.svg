<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1200" viewBox="0 0 1800 1200" role="img" aria-labelledby="title description">
  <title id="title">Delivery Drone Dispatch architecture and strategy class diagram</title>
  <desc id="description">Facade workflow for Assignment 4 and two Strategy families for Assignment 5.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .page { fill: #f8fafc; }
      .title { font: 700 28px Arial, sans-serif; fill: #0f172a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #475569; }
      .section { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.5; }
      .family { fill: #ffffff; stroke: #94a3b8; stroke-width: 1.3; stroke-dasharray: 7 5; }
      .section-label { font: 700 19px Arial, sans-serif; fill: #1e3a8a; }
      .family-label { font: 700 16px Arial, sans-serif; fill: #334155; }
      .box { fill: #ffffff; stroke: #64748b; stroke-width: 1.4; }
      .client { fill: #fefce8; stroke: #ca8a04; stroke-width: 1.7; }
      .facade { fill: #eef2ff; stroke: #4f46e5; stroke-width: 1.7; }
      .service { fill: #ecfdf5; stroke: #059669; stroke-width: 1.6; }
      .repo { fill: #fff7ed; stroke: #ea580c; stroke-width: 1.6; }
      .context { fill: #eff6ff; stroke: #2563eb; stroke-width: 1.7; }
      .selector { fill: #fdf4ff; stroke: #9333ea; stroke-width: 1.7; }
      .interface { fill: #f0fdfa; stroke: #0f766e; stroke-width: 1.7; }
      .strategy { fill: #f0fdf4; stroke: #16a34a; stroke-width: 1.5; }
      .model { fill: #fff7ed; stroke: #c2410c; stroke-width: 1.4; }
      .external { fill: #fef2f2; stroke: #dc2626; stroke-width: 1.5; }
      .name { font: 700 14px Arial, sans-serif; fill: #0f172a; text-anchor: middle; }
      .detail { font: 12px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .stereotype { font: italic 12px Arial, sans-serif; fill: #475569; text-anchor: middle; }
      .edge { fill: none; stroke: #475569; stroke-width: 1.5; marker-end: url(#arrow); }
      .dash { fill: none; stroke: #64748b; stroke-width: 1.4; stroke-dasharray: 6 4; marker-end: url(#arrow); }
      .edge-label { font: 11px Arial, sans-serif; fill: #64748b; text-anchor: middle; }
      .note { font: 13px Arial, sans-serif; fill: #475569; }
    </style>
  </defs>

  <rect class="page" width="1800" height="1200"/>
  <text x="900" y="42" class="title" text-anchor="middle">Delivery Drone Dispatch — current class diagram</text>
  <text x="900" y="66" class="subtitle" text-anchor="middle">Assignment 4: Facade workflow · Assignment 5: interchangeable Strategy algorithms</text>

  <!-- Assignment 4 -->
  <rect x="30" y="95" width="1740" height="380" rx="14" class="section"/>
  <text x="55" y="126" class="section-label">Assignment 4 — Facade and persistence workflow</text>

  <rect x="755" y="145" width="290" height="55" rx="9" class="client"/>
  <text x="900" y="170" class="name">ConsoleMenu</text>
  <text x="900" y="188" class="stereotype">«client»</text>

  <rect x="245" y="245" width="270" height="64" rx="9" class="facade"/>
  <text x="380" y="271" class="name">AdminFacade</text>
  <text x="380" y="291" class="detail">inspect data · recover pending</text>

  <rect x="675" y="235" width="450" height="84" rx="9" class="facade"/>
  <text x="900" y="266" class="name">DispatchFacade</text>
  <text x="900" y="287" class="detail">coordinates A → B → C</text>
  <text x="900" y="305" class="stereotype">«Facade»</text>

  <rect x="1285" y="245" width="250" height="64" rx="9" class="service"/>
  <text x="1410" y="271" class="name">CompensationService</text>
  <text x="1410" y="291" class="detail">reverses committed work</text>

  <rect x="115" y="365" width="330" height="66" rx="9" class="service"/>
  <text x="280" y="391" class="name">PlanningService</text>
  <text x="280" y="411" class="detail">FlightPlan · Zone</text>

  <rect x="575" y="365" width="330" height="66" rx="9" class="service"/>
  <text x="740" y="391" class="name">DronePreparationService</text>
  <text x="740" y="411" class="detail">Drone · DroneBooking</text>

  <rect x="1035" y="365" width="330" height="66" rx="9" class="service"/>
  <text x="1200" y="391" class="name">LandingService</text>
  <text x="1200" y="411" class="detail">LandingPad · DeliveryConfirmation</text>

  <rect x="1485" y="365" width="210" height="66" rx="9" class="repo"/>
  <text x="1590" y="391" class="name">Repositories</text>
  <text x="1590" y="411" class="detail">SQLite persistence</text>

  <path d="M 845 200 L 430 245" class="edge"/>
  <path d="M 955 200 L 850 235" class="edge"/>
  <path d="M 380 309 L 1285 270" class="edge"/>
  <path d="M 900 319 L 280 365" class="edge"/>
  <path d="M 900 319 L 740 365" class="edge"/>
  <path d="M 900 319 L 1200 365" class="edge"/>
  <path d="M 1125 277 L 1285 277" class="edge"/>
  <path d="M 445 398 L 1485 398" class="edge"/>
  <text x="960" y="455" class="note" text-anchor="middle">DispatchFacade persists progress; CompensationService rolls back A or B → A after a downstream failure.</text>

  <!-- Assignment 5 -->
  <rect x="30" y="510" width="1740" height="650" rx="14" class="section"/>
  <text x="55" y="542" class="section-label">Assignment 5 — Strategy Pattern</text>

  <rect x="70" y="580" width="175" height="68" rx="9" class="client"/>
  <text x="157" y="608" class="name">StrategyDemo</text>
  <text x="157" y="628" class="detail">manual · automatic · switch</text>

  <!-- Drone selection family -->
  <rect x="285" y="565" width="670" height="540" rx="12" class="family"/>
  <text x="310" y="592" class="family-label">Drone selection family</text>

  <rect x="320" y="620" width="230" height="58" rx="8" class="selector"/>
  <text x="435" y="646" class="name">DroneSelectionSelector</text>
  <text x="435" y="665" class="detail">chooses by request</text>

  <rect x="655" y="620" width="250" height="58" rx="8" class="context"/>
  <text x="780" y="646" class="name">DroneSelectionContext</text>
  <text x="780" y="665" class="detail">setStrategy() · select()</text>

  <rect x="485" y="735" width="270" height="59" rx="8" class="interface"/>
  <text x="620" y="760" class="name">DroneSelectionStrategy</text>
  <text x="620" y="780" class="stereotype">«interface» select(request, drones)</text>

  <rect x="315" y="855" width="175" height="65" rx="8" class="strategy"/>
  <text x="402" y="881" class="name">NearestDrone</text>
  <text x="402" y="901" class="detail">pickup distance</text>
  <rect x="535" y="855" width="175" height="65" rx="8" class="strategy"/>
  <text x="622" y="881" class="name">HighestBattery</text>
  <text x="622" y="901" class="detail">battery percent</text>
  <rect x="755" y="855" width="175" height="65" rx="8" class="strategy"/>
  <text x="842" y="881" class="name">LeastBusy</text>
  <text x="842" y="901" class="detail">active deliveries</text>

  <rect x="370" y="980" width="210" height="55" rx="8" class="model"/>
  <text x="475" y="1006" class="name">DeliveryRequest</text>
  <text x="475" y="1023" class="detail">payload · urgent</text>
  <rect x="665" y="980" width="210" height="55" rx="8" class="model"/>
  <text x="770" y="1006" class="name">DroneOption</text>
  <text x="770" y="1023" class="detail">battery · load · distance</text>

  <path d="M 245 606 L 320 649" class="edge"/>
  <path d="M 550 649 L 620 735" class="edge"/>
  <path d="M 780 678 L 680 735" class="edge"/>
  <path d="M 402 855 L 540 794" class="dash"/>
  <path d="M 622 855 L 620 794" class="dash"/>
  <path d="M 842 855 L 700 794" class="dash"/>
  <path d="M 475 980 L 535 794" class="dash"/>
  <path d="M 770 980 L 705 794" class="dash"/>
  <text x="845" y="720" class="edge-label">delegates</text>
  <text x="635" y="830" class="edge-label">implements</text>

  <!-- Flight time family -->
  <rect x="1000" y="565" width="720" height="540" rx="12" class="family"/>
  <text x="1025" y="592" class="family-label">Flight-time family</text>

  <rect x="1035" y="620" width="230" height="58" rx="8" class="selector"/>
  <text x="1150" y="646" class="name">FlightTimeSelector</text>
  <text x="1150" y="665" class="detail">urgent · wind</text>

  <rect x="1390" y="620" width="275" height="58" rx="8" class="context"/>
  <text x="1527" y="646" class="name">FlightTimeContext</text>
  <text x="1527" y="665" class="detail">setStrategy() · estimateMinutes()</text>

  <rect x="1235" y="735" width="250" height="59" rx="8" class="interface"/>
  <text x="1360" y="760" class="name">FlightTimeStrategy</text>
  <text x="1360" y="780" class="stereotype">«interface» estimateMinutes(request)</text>

  <rect x="1035" y="855" width="185" height="65" rx="8" class="strategy"/>
  <text x="1127" y="881" class="name">StandardFlightTime</text>
  <text x="1127" y="901" class="detail">normal speed</text>
  <rect x="1265" y="855" width="185" height="65" rx="8" class="strategy"/>
  <text x="1357" y="881" class="name">ExpressFlightTime</text>
  <text x="1357" y="901" class="detail">launch + fast speed</text>
  <rect x="1495" y="855" width="185" height="65" rx="8" class="strategy"/>
  <text x="1587" y="881" class="name">WeatherFlightTime</text>
  <text x="1587" y="901" class="detail">wind-adjusted speed</text>

  <rect x="1060" y="980" width="190" height="55" rx="8" class="model"/>
  <text x="1155" y="1006" class="name">DeliveryRequest</text>
  <text x="1155" y="1023" class="detail">zone · distance</text>
  <rect x="1330" y="980" width="165" height="55" rx="8" class="external"/>
  <text x="1412" y="1006" class="name">WindSource</text>
  <text x="1412" y="1023" class="stereotype">«interface»</text>
  <rect x="1535" y="980" width="160" height="55" rx="8" class="external"/>
  <text x="1615" y="1006" class="name">SimulatedWindSource</text>
  <text x="1615" y="1023" class="detail">fixed map values</text>

  <path d="M 245 606 L 985 606 L 1035 649" class="edge"/>
  <path d="M 1265 649 L 1300 735" class="edge"/>
  <path d="M 1527 678 L 1430 735" class="edge"/>
  <path d="M 1127 855 L 1280 794" class="dash"/>
  <path d="M 1357 855 L 1360 794" class="dash"/>
  <path d="M 1587 855 L 1440 794" class="dash"/>
  <path d="M 1155 980 L 1300 794" class="dash"/>
  <path d="M 1587 920 L 1412 980" class="edge"/>
  <path d="M 1615 980 L 1495 1007" class="dash"/>
  <text x="1510" y="720" class="edge-label">delegates</text>
  <text x="1375" y="830" class="edge-label">implements</text>
  <text x="1500" y="960" class="edge-label">reads wind</text>

  <text x="900" y="1135" class="note" text-anchor="middle">Solid arrows show use or delegation. Dashed arrows show interface implementation or data dependency.</text>
</svg>
