<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="930" viewBox="0 0 1400 930">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#334155"/></marker>
    <style>
      .group{stroke:#64748b;stroke-width:2;rx:12}.box{fill:#fff;stroke:#475569;stroke-width:1.5;rx:6}.label{font:600 17px Arial;fill:#0f172a}.text{font:14px Arial;fill:#1e293b}.edge{stroke:#334155;stroke-width:1.5;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="930" fill="#f8fafc"/>
  <text x="700" y="32" text-anchor="middle" class="label" font-size="22">Delivery Drone Dispatch Class Diagram</text>

  <rect x="45" y="70" width="250" height="95" fill="#fef3c7" class="group"/>
  <text x="65" y="96" class="label">Client</text><rect x="80" y="112" width="180" height="34" class="box"/><text x="170" y="134" text-anchor="middle" class="text">ConsoleMenu</text>

  <rect x="500" y="60" width="390" height="205" fill="#ede9fe" class="group"/>
  <text x="520" y="86" class="label">facade</text>
  <rect x="530" y="105" width="145" height="52" class="box"/><text x="602" y="128" text-anchor="middle" class="text">DispatchFacade</text><text x="602" y="146" text-anchor="middle" class="text">dispatch(...)</text>
  <rect x="710" y="105" width="145" height="52" class="box"/><text x="782" y="128" text-anchor="middle" class="text">AdminFacade</text><text x="782" y="146" text-anchor="middle" class="text">recoverPending()</text>
  <rect x="530" y="185" width="145" height="34" class="box"/><text x="602" y="207" text-anchor="middle" class="text">CompensationService</text>
  <rect x="710" y="185" width="145" height="34" class="box"/><text x="782" y="207" text-anchor="middle" class="text">ChainRepository</text>
  <rect x="620" y="230" width="145" height="24" class="box"/><text x="692" y="247" text-anchor="middle" class="text">DispatchChain + status</text>

  <rect x="45" y="330" width="390" height="250" fill="#dbeafe" class="group"/>
  <text x="65" y="357" class="label">planning A</text>
  <rect x="70" y="380" width="140" height="34" class="box"/><text x="140" y="402" text-anchor="middle" class="text">PlanningService</text>
  <rect x="245" y="380" width="155" height="34" class="box"/><text x="322" y="402" text-anchor="middle" class="text">FlightPlanRepository</text>
  <rect x="70" y="465" width="140" height="34" class="box"/><text x="140" y="487" text-anchor="middle" class="text">FlightPlan + status</text>
  <rect x="245" y="465" width="110" height="34" class="box"/><text x="300" y="487" text-anchor="middle" class="text">Zone</text>
  <path d="M322 414 L322 465" class="edge"/><path d="M245 414 L190 465" class="edge"/>

  <rect x="505" y="330" width="390" height="250" fill="#dcfce7" class="group"/>
  <text x="525" y="357" class="label">droneprep B</text>
  <rect x="530" y="380" width="175" height="34" class="box"/><text x="617" y="402" text-anchor="middle" class="text">DronePreparationService</text>
  <rect x="735" y="380" width="125" height="34" class="box"/><text x="797" y="402" text-anchor="middle" class="text">DroneRepository</text>
  <rect x="555" y="465" width="105" height="34" class="box"/><text x="607" y="487" text-anchor="middle" class="text">Drone</text>
  <rect x="715" y="465" width="140" height="34" class="box"/><text x="785" y="487" text-anchor="middle" class="text">DroneBooking + status</text>
  <path d="M770 414 L620 465" class="edge"/><path d="M797 414 L785 465" class="edge"/>

  <rect x="965" y="330" width="390" height="250" fill="#fee2e2" class="group"/>
  <text x="985" y="357" class="label">landing C</text>
  <rect x="990" y="380" width="130" height="34" class="box"/><text x="1055" y="402" text-anchor="middle" class="text">LandingService</text>
  <rect x="1160" y="380" width="155" height="34" class="box"/><text x="1237" y="402" text-anchor="middle" class="text">DeliveryRepository</text>
  <rect x="990" y="465" width="130" height="34" class="box"/><text x="1055" y="487" text-anchor="middle" class="text">LandingPad + status</text>
  <rect x="1160" y="465" width="155" height="34" class="box"/><text x="1237" y="487" text-anchor="middle" class="text">DeliveryConfirmation + status</text>
  <path d="M1200 414 L1065 465" class="edge"/><path d="M1237 414 L1237 465" class="edge"/>

  <path d="M260 129 L530 129" class="edge"/><path d="M260 140 L710 140" class="edge"/>
  <path d="M602 157 L140 380" class="edge"/><path d="M602 157 L617 380" class="edge"/><path d="M602 157 L1055 380" class="edge"/>
  <path d="M602 157 L322 380" class="edge"/><path d="M602 157 L797 380" class="edge"/><path d="M602 157 L1237 380" class="edge"/>
  <path d="M602 157 L602 185" class="edge"/><path d="M782 157 L602 185" class="edge"/><path d="M602 219 L692 230" class="edge"/><path d="M782 219 L782 230" class="edge"/>
  <text x="700" y="650" text-anchor="middle" class="text">Only facades coordinate the three subsystems. Each subsystem keeps its own state and repository.</text>
</svg>
